# Project settings read by scripts/agent_check.py. Agents read this too.

dbt = ["uv", "run", "dbt"]    # command used to call dbt, as an argument list
project_dir = "."             # folder containing dbt_project.yml, relative to the repo root
targets = []                  # profile targets to parse, primary first; [] = profile default
compile = false               # also compile the primary target (opens a warehouse connection)

